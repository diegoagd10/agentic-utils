<!doctype html>
<html lang="LANG" style="color-scheme: dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FEATURE — design review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!--
    Controls ship in English and Spanish. For any other LANG, keep this
    block with every value translated; otherwise delete it.
  -->
  <script type="application/json" data-dui-strings>
  {
    "pick": "Pick this one",
    "picked": "✓ Picked",
    "ownAnswer": "Or write your own answer…",
    "rowHasNotes": "This row has notes: remove them to pick an option.",
    "pickCleared": "Removed the picked option in that row: pick or comment, not both.",
    "notePlaceholder": "Your note…",
    "queueNote": "Add to queue",
    "cancel": "Cancel",
    "chatPlaceholder": "General comment on this part…",
    "send": "Send feedback",
    "finish": "Approve and write design.md",
    "continue": "Continue",
    "approve": "Approve",
    "part": "part",
    "feedbackQueued": "Feedback is queued: send or remove it to continue.",
    "pickEachRow": "Pick an option in every row or send feedback.",
    "sendFailed": "Could not send ({error}). Your feedback is still queued.",
    "working": "Agent working…",
    "ended": "Session ended.",
    "notListening": "The agent is not listening; your feedback arrives on its next wait.",
    "offline": "No connection to the server."
  }
  </script>
</head>
<body class="bg-slate-950 text-slate-300 antialiased">
<main class="mx-auto max-w-7xl px-6 py-10 space-y-10">

  <header>
    <p class="text-xs uppercase tracking-wider text-slate-400">
      Design review · to-design-v2
    </p>
    <h1 class="font-serif text-3xl text-slate-100">FEATURE</h1>
    <p class="text-sm text-slate-400">Source: SOURCE</p>
  </header>

  <!--
    One <section data-part> per part, in order. Only the last section
    without data-approved is interactive. When a part is approved, add
    data-approved, keep only the chosen content, and wrap it in
    <details> so it collapses.

    Approved part:
    <section data-part="1" data-title="Open questions" data-approved>
      <details>
        <summary class="cursor-pointer font-serif text-xl">
          1 · Open questions <span class="text-emerald-400">✓</span>
        </summary>
        ...chosen answers...
      </details>
    </section>
  -->

  <!--
    Active part with options: one row, three full-width options stacked
    vertically. Each option is one subagent's whole approach, with the
    part's views stacked inside it.
    Part 1 uses one row per question instead, each marked
    data-own-answer so the user can also type an answer of their own:
    <div data-row="q1" data-own-answer class="space-y-4">
  -->
  <section data-part="4" data-title="File tree + Call tree" class="space-y-6">
    <h2 class="font-serif text-2xl text-slate-100">4 · File tree + Call tree</h2>

    <!-- Points all three options share, written once. Not an option. -->
    <div class="rounded-lg border border-dashed border-slate-700 p-4 text-sm">
      <h3 class="text-xs uppercase tracking-wider text-slate-400">Shared by all three</h3>
      <ul class="list-disc pl-5">...</ul>
    </div>

    <div data-row="approach" class="space-y-4">
      <article data-option="A" data-approach="APPROACH A"
        class="rounded-lg border border-slate-800 bg-slate-900 p-4 space-y-4">
        <div>
          <h3 class="text-xs uppercase tracking-wider text-slate-400">File tree</h3>
          <pre class="font-mono text-sm overflow-x-auto">...</pre>
        </div>
        <div>
          <h3 class="text-xs uppercase tracking-wider text-slate-400">Call tree</h3>
          <pre class="font-mono text-sm overflow-x-auto">...</pre>
        </div>
      </article>
      <article data-option="B" data-approach="APPROACH B" class="...">...</article>
      <article data-option="C" data-approach="APPROACH C" class="...">...</article>
    </div>
  </section>

</main>
</body>
</html>
